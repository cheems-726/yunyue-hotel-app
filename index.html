<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- V49：状态栏/地址栏主题色跟随明暗（手机顶部不刺眼） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101114" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="云悦酒店" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>云悦酒店 · 经营模拟</title>
  </head>
  <body>
    <!-- ★ V140 §2：静态骨架（不依赖 JS）。JS 没跑起来/内核解析失败时，用户至少看到文字而不是白屏。 -->
    <div id="boot" role="status" aria-live="polite" style="padding:48px 20px;font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#333;text-align:center">
      <div style="font-size:22px;font-weight:700;margin-bottom:10px">云悦酒店 · 正在加载…</div>
      <div style="font-size:13px;color:#777">若 10 秒后仍停留在此，请点下面的「诊断」（断网或浏览器内核过旧都会显示诊断信息）</div>
      <button id="boot-diag" type="button" style="margin-top:16px;padding:12px 18px;font-size:15px;border:1px solid #ccc;border-radius:10px;background:#fff;color:#333">诊断</button>
    </div>
    <noscript>
      <div style="padding:32px 20px;font:16px/1.7 sans-serif;color:#b00;text-align:center">请开启 JavaScript 后再试（浏览器设置 → 网站设置 → JavaScript）。</div>
    </noscript>
    <div id="root"></div>

    <!-- ★ V140 §2：全局兜底（ES5 写法！旧 X5 内核也必须能执行）。捕获脚本错误/未处理 Promise，显示可复制的面板。 -->
    <script>
      (function () {
        function buildNo() {
          try {
            var s = document.querySelector('script[type=module]');
            var m = s && s.src ? String(s.src).match(/index-[A-Za-z0-9_-]+\.js/) : null;
            return m ? m[0] : '开发/未知';
          } catch (e) { return '未知'; }
        }
        function kernel(ua) {
          ua = String(ua || '');
          var c = /Chrome\/(\d+)/.exec(ua);
          var x5 = /X5|XWeb/i.test(ua) || (/MicroMessenger/i.test(ua) && /Android/i.test(ua));
          var ios = /iPhone|iPad|iPod/i.test(ua);
          var base = c ? 'Chrome/' + c[1] : (ios ? 'iOS WebKit' : '未知内核');
          return base + (x5 ? ' · X5/XWeb' : '');
        }
        function swText() {
          try { return ('serviceWorker' in navigator) && navigator.serviceWorker.controller ? '已接管' : '未接管'; } catch (e) { return '未知'; }
        }
        function show(msg) {
          if (document.getElementById('boot-error')) return;
          // ★ T2（2026-11-09）：诊断**不再全屏占盘** —— 底部一条可折叠条，默认只露一行摘要。
          //   老师现场反馈"上面一直出现诊断，下面显示不完全"就是全屏面板导致的。
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#fff;color:#111;padding:10px 12px;max-height:46vh;overflow:auto;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border-top:2px solid #e0b400;box-shadow:0 -4px 16px rgba(0,0,0,.12)';
          var h = document.createElement('div');
          h.style.cssText = 'font-size:15px;font-weight:700;margin-bottom:4px;padding-right:70px';
          h.appendChild(document.createTextNode('页面启动失败（不是账号问题）'));
          box.appendChild(h);
          var 摘要 = document.createElement('div');
          摘要.style.cssText = 'font-size:12px;color:#555;margin-bottom:4px;padding-right:70px';
          摘要.appendChild(document.createTextNode(msg));
          box.appendChild(摘要);
          // 折叠区：帮助文案 + 诊断文本 + 重试
          var more = document.createElement('div');
          more.style.cssText = 'display:none';
          var p = document.createElement('div');
          p.style.cssText = 'font-size:12px;color:#555;margin-bottom:6px';
          p.appendChild(document.createTextNode('请把下面内容截图/复制发给老师；点「重试」可再试一次。'));
          more.appendChild(p);
          var ta = document.createElement('textarea');
          ta.readOnly = true;
          ta.style.cssText = 'width:100%;height:150px;font:11px/1.5 monospace;box-sizing:border-box';
          ta.value = '错误：' + msg + '\n构建号：' + buildNo() + '\nUA：' + navigator.userAgent +
            '\n内核：' + kernel(navigator.userAgent) + '\nSW：' + swText() +
            '\n地址：' + location.href + '\n时间：' + new Date().toISOString();
          more.appendChild(ta);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.style.cssText = 'margin-top:8px;padding:9px 14px;font-size:14px;border:1px solid #ccc;border-radius:10px;background:#fff';
          btn.appendChild(document.createTextNode('重试'));
          btn.onclick = function () { location.reload(); };
          more.appendChild(btn);
          box.appendChild(more);
          // 折叠开关（默认收起 ⇒ 不占首屏）
          var tgl = document.createElement('button');
          tgl.type = 'button';
          tgl.style.cssText = 'position:absolute;right:10px;top:8px;padding:6px 10px;font-size:12px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#333';
          tgl.appendChild(document.createTextNode('诊断 ▸'));
          tgl.onclick = function () {
            var open = more.style.display !== 'none';
            more.style.display = open ? 'none' : 'block';
            tgl.textContent = open ? '诊断 ▸' : '收起 ▾';
          };
          box.appendChild(tgl);
          (document.body || document.documentElement).appendChild(box);
        }
        function ignore(msg) {
          var s = String(msg || '');
          return /plugin is not implemented/i.test(s) || /ResizeObserver loop/i.test(s) || /^Script error\.?$/i.test(s);
        }
        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || e.type)) || 'script error';
          if (!ignore(msg)) show(msg);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var msg = (r && (r.message || String(r))) || 'unhandledrejection';
          if (!ignore(msg)) show(msg);
        });
        var d = document.getElementById('boot-diag');
        if (d) { d.onclick = function () { show('用户主动点诊断'); }; }
        setTimeout(function () {
          var b = document.getElementById('boot');
          var r = document.getElementById('root');
          if (b && (!r || !r.firstChild)) { show('脚本 10 秒内未启动（可能是断网，或浏览器内核过旧）'); }
        }, 10000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // ★ T2（2026-11-09）：旧 Service Worker 会把换包后的客户端锁在旧 JS 上（旧包没有离线演示入口）。
      // 做法：比对线上 /sw.js 的 CACHE_NAME（构建时注入时间戳）与本地记录；变了 ⇒ 注销旧 SW + 清缓存 + 只 reload 一次。
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var 注册 = function () { navigator.serviceWorker.register('/sw.js').catch(function () {}) }
          if (!window.fetch || !window.localStorage) { 注册(); return }
          fetch('/sw.js', { cache: 'no-store' }).then(function (r) { return r.text() }).then(function (t) {
            var m = /CACHE_NAME\s*=\s*'([^']+)'/.exec(t)
            var v = m ? m[1] : ''
            if (!v) { 注册(); return }
            var seen = null
            try { seen = localStorage.getItem('sw-cache-seen') } catch (e) {}
            // ★ T2 补（老用户）：从没记录版本、但已有 SW 在接管 ⇒ 说明是换新功能上线前就装过旧 SW，
            //   旧 SW 可能 cache-first 把 index.html 锁死（页面能开但点不动/跳不了）。同样清一次。
            var 疑似旧SW = !seen && !!navigator.serviceWorker.controller
            if ((seen && seen !== v) || 疑似旧SW) {
              try { localStorage.setItem('sw-cache-seen', v) } catch (e) {}
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }).then(function () {
                if (!window.caches) return
                return caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) })
              }).then(function () {
                var done = false
                try { done = sessionStorage.getItem('sw-healed') === '1' } catch (e) {}
                if (!done) {
                  try { sessionStorage.setItem('sw-healed', '1') } catch (e) {}
                  location.reload()
                }
              }).catch(function () {})
              return
            }
            try { localStorage.setItem('sw-cache-seen', v) } catch (e) {}
            注册()
          }).catch(function () { 注册() })
        })
      }
    </script>
  </body>
</html>
